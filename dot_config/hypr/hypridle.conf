general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/script/hyprlock_helper.sh
    before_sleep_cmd = playerctl --all-players pause; loginctl lock-session
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'enable' })"
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360
    on-timeout = playerctl --all-players pause; hyprctl dispatch "hl.dsp.dpms({ action = 'disable' })"
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = 'enable' })"
}

listener {
    timeout = 1800
    on-timeout = playerctl --all-players pause; systemctl suspend
}
